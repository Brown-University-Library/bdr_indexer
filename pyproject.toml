readme = "README.md"
requires-python = ">=3.8.9,<3.9"
dependencies = [
    "bdrocfl==0.5",
    "bdrxml==1.4",
    "certifi==2021.5.30",
    "charset-normalizer==2.0.12",
    "click==7.1.2",
    "diskcache==5.2.1",
    "django-dotenv==1.4.2",
    "eulxml==1.1.3",
    "idna==2.10",
    "inflection==0.5.1",
    "isodate==0.6.0",
    "lxml==4.7.1",
    "ply==3.8",
    "pyparsing==2.4.7",
    "rdflib==5.0.0",
    "redis==3.5.3",
    "requests==2.27.1",
    "roman==3.3",
    "rq==0.13.0",
    "setuptools==49.2.1",
    "six==1.16.0",
    "urllib3==1.26.6",
